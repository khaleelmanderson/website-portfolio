<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Project Management</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <!-- Shared theme tokens (colors + Fraunces/Manrope) — same file as index.html and project-detail.html, see assets/css/theme.css -->
    <link rel="stylesheet" href="assets/css/theme.css">
    <style>
        /* Lighter pass of the same "Sunset" design system used on the public
           pages — this is an internal tool, so just enough polish to feel
           consistent rather than jarringly different. Tokens come from
           assets/css/theme.css (--indigo, --panel, --sun, --citrus, --sea,
           --vermil, --sand, --font-heading, --font-body). */
        body {
            background-color: var(--indigo);
            color: var(--sand);
            font-family: var(--font-body);
            padding-top: 20px;
        }
        .container {
            max-width: 1200px;
        }
        h2, h3, h4 {
            font-family: var(--font-heading);
            font-weight: 700;
            color: var(--sand);
        }
        label {
            font-family: var(--font-body);
            font-weight: 500;
        }
        .login-container {
            max-width: 400px;
            margin: 50px auto;
            background: var(--panel);
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        .dashboard-container {
            background: var(--panel);
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        .form-section {
            margin-bottom: 30px;
        }
        .form-section h3 {
            border-bottom: 2px solid rgba(239, 230, 211, 0.15);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        /* Form fields — subtle border in the panel tone, citrus on focus */
        .form-control {
            background-color: var(--indigo);
            color: var(--sand);
            border: 1px solid var(--panel);
            box-shadow: none;
        }
        .form-control:focus {
            background-color: var(--indigo);
            color: var(--sand);
            border-color: var(--citrus);
            box-shadow: 0 0 0 3px rgba(232, 98, 61, 0.25);
        }
        .form-control::placeholder {
            color: rgba(239, 230, 211, 0.45);
        }
        .form-text.text-muted {
            color: rgba(239, 230, 211, 0.55);
        }
        #image-preview {
            max-width: 200px;
            max-height: 200px;
            margin-top: 10px;
            border-radius: 4px;
            border: 1px solid var(--panel);
            display: none;
        }
        .project-row {
            padding: 15px;
            background: var(--panel);
            border: 1px solid rgba(239, 230, 211, 0.1);
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .project-row img {
            margin-bottom: 10px;
        }
        .status-badge {
            margin-left: 10px;
            font-family: var(--font-body);
        }
        /* Same functional meaning (draft vs published), just retinted:
           draft in a muted neutral tone, published in --sea */
        .status-badge.status-draft {
            background-color: rgba(239, 230, 211, 0.18);
            color: var(--sand);
        }
        .status-badge.status-published {
            background-color: var(--sea);
            color: var(--sand);
        }
        #alert-container {
            margin-bottom: 20px;
        }
        .btn-group-form {
            margin-top: 20px;
        }
        /* Publish / Save as Draft / Update / Cancel — retinted to the palette,
           dark text on the lighter accent colors for contrast */
        #publish-btn {
            background-color: var(--sun);
            border-color: var(--sun);
            color: var(--indigo);
        }
        #publish-btn:hover,
        #publish-btn:focus {
            background-color: var(--citrus);
            border-color: var(--citrus);
            color: var(--sand);
        }
        #draft-btn {
            background-color: var(--sea);
            border-color: var(--sea);
            color: var(--indigo);
        }
        #draft-btn:hover,
        #draft-btn:focus {
            background-color: var(--sea);
            border-color: var(--sea);
            color: var(--sand);
            opacity: 0.9;
        }
        #update-btn {
            background-color: var(--citrus);
            border-color: var(--citrus);
            color: var(--sand);
        }
        #cancel-btn,
        #logout-btn {
            background-color: transparent;
            border-color: rgba(239, 230, 211, 0.3);
            color: var(--sand);
        }
        #cancel-btn:hover,
        #logout-btn:hover {
            background-color: rgba(239, 230, 211, 0.1);
            color: var(--sand);
        }
        /* Edit / Delete on each project row */
        .project-row .btn-primary {
            background-color: var(--citrus);
            border-color: var(--citrus);
            color: var(--sand);
        }
        .project-row .btn-danger {
            background-color: var(--vermil);
            border-color: var(--vermil);
            color: var(--sand);
        }
        .gallery-upload-dropzone {
            border: 1px dashed var(--sea);
            border-radius: 4px;
            background: var(--indigo);
            padding: 18px 16px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }
        .gallery-upload-dropzone:hover,
        .gallery-upload-dropzone.is-dragover {
            border-color: var(--citrus);
            background-color: var(--panel);
            box-shadow: inset 0 0 0 1px rgba(232, 98, 61, 0.2);
        }
        .gallery-upload-content {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: var(--sand);
        }
        .gallery-upload-content .glyphicon {
            font-size: 20px;
            color: var(--sea);
        }
        .gallery-upload-content strong {
            display: block;
            margin-bottom: 2px;
            font-size: 14px;
        }
        .gallery-browse-btn {
            padding: 0;
            border: none;
            background: none;
            color: var(--sun);
            font-weight: 600;
            text-decoration: underline;
        }
        .gallery-upload-preview {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(239, 230, 211, 0.15);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .gallery-thumb {
            position: relative;
            width: 110px;
            border: 1px solid rgba(239, 230, 211, 0.15);
            border-radius: 4px;
            background: var(--indigo);
            overflow: hidden;
        }
        .gallery-thumb img {
            display: block;
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-bottom: 1px solid rgba(239, 230, 211, 0.15);
        }
        .gallery-thumb-name {
            display: block;
            padding: 5px 8px 8px;
            font-size: 11px;
            line-height: 1.3;
            color: var(--sand);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .gallery-thumb-remove {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 22px;
            height: 22px;
            padding: 0;
            border: 1px solid rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 16px;
            line-height: 1;
        }
        .gallery-invalid-list {
            margin-top: 12px;
            padding: 8px 10px;
            border: 1px solid var(--vermil);
            border-radius: 4px;
            background: rgba(214, 84, 56, 0.12);
            display: none;
        }
        .gallery-invalid-item {
            font-size: 12px;
            color: var(--sand);
            margin: 4px 0;
        }
        .gallery-invalid-name {
            font-weight: 600;
            color: var(--vermil);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGIN SECTION -->
        <div id="login-section">
            <div class="login-container">
                <h2>Admin Login</h2>
                <div id="login-alert" class="alert alert-danger" style="display:none;"></div>
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" class="form-control" id="login-email" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" class="form-control" id="login-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Login</button>
                </form>
            </div>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboard-section" style="display:none;">
            <div class="dashboard-container">
                <div class="row">
                    <div class="col-sm-6">
                        <h2>Project Dashboard</h2>
                    </div>
                    <div class="col-sm-6 text-right">
                        <button id="logout-btn" class="btn btn-default">Logout</button>
                    </div>
                </div>

                <!-- Alert Container -->
                <div id="form-alert" class="alert" style="display:none; margin-top:20px;"></div>

                <!-- Compose Form -->
                <div class="form-section">
                    <h3>Compose New Project</h3>
                    <form id="project-form">
                        <input type="hidden" id="project-id">
                        
                        <div class="form-group">
                            <label for="title">Project Title *</label>
                            <input type="text" class="form-control" id="title" required>
                        </div>

                        <div class="form-group">
                            <label for="description">Description *</label>
                            <textarea class="form-control" id="description" rows="5" required></textarea>
                        </div>

                        <div class="form-group">
                            <label for="tags">Tags (comma-separated)</label>
                            <input type="text" class="form-control" id="tags" placeholder="e.g., design, web, react">
                        </div>

                        <div class="form-group">
                            <label for="role">Role</label>
                            <input type="text" class="form-control" id="role">
                        </div>

                        <div class="form-group">
                            <label for="tools">Tools</label>
                            <input type="text" class="form-control" id="tools">
                        </div>

                        <div class="form-group">
                            <label for="focus">Focus</label>
                            <input type="text" class="form-control" id="focus">
                        </div>

                        <div class="form-group">
                            <label for="key_highlights">Key Highlights</label>
                            <textarea class="form-control" id="key_highlights" rows="4" placeholder="One highlight per line"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="project_link">Project Link</label>
                            <input type="url" class="form-control" id="project_link" placeholder="https://...">
                        </div>

                        <div class="form-group">
                            <label for="image">Project Image</label>
                            <input type="file" class="form-control" id="image" accept="image/*">
                            <small class="form-text text-muted">JPG, PNG, or GIF</small>
                        </div>

                        <div class="form-group">
                            <label>Additional Gallery Images</label>
                            <div id="gallery-dropzone" class="gallery-upload-dropzone" tabindex="0" role="button" aria-label="Upload gallery images">
                                <input type="file" id="gallery-images" accept="image/*" multiple style="display:none;">
                                <div class="gallery-upload-content">
                                    <span class="glyphicon glyphicon-cloud-upload" aria-hidden="true"></span>
                                    <div>
                                        <strong>Drag &amp; drop images here</strong>
                                        <span>or <button type="button" class="btn btn-link gallery-browse-btn">Choose files</button></span>
                                    </div>
                                </div>
                            </div>
                            <div id="gallery-preview" class="gallery-upload-preview" aria-live="polite"></div>
                            <div id="gallery-invalid-list" class="gallery-invalid-list" aria-live="polite"></div>
                            <small class="form-text text-muted">JPG, PNG, or GIF; 5MB max per image</small>
                        </div>

                        <div class="form-group">
                            <img id="image-preview" alt="Preview" style="display:none;">
                        </div>

                        <div class="btn-group-form">
                            <button type="button" id="publish-btn" class="btn btn-success">Publish</button>
                            <button type="button" id="draft-btn" class="btn btn-info">Save as Draft</button>
                            <button type="button" id="update-btn" class="btn btn-warning" style="display:none;">Update</button>
                            <button type="button" id="cancel-btn" class="btn btn-default" style="display:none;">Cancel</button>
                        </div>
                    </form>
                </div>

                <!-- Projects List -->
                <div class="form-section">
                    <h3>Projects</h3>
                    <div id="projects-list">
                        <p>Loading…</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery and Supabase -->
    <script src="https://code.jquery.com/jquery-1.11.3.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Admin Logic -->
    <script src="assets/js/admin.js"></script>
</body>
</html>
